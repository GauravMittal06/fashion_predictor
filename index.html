<!doctype html>
<html lang="en">
<head>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  <style>
    html, body { margin: 0; background: #ffffff; }
    #loading { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #374151;
               max-width: 560px; margin: 18vh auto 0; padding: 0 16px; text-align: center; }
    #loading h1 { font-size: 1.6rem; margin: 0 0 .5rem; color: #111827; }
    #loading p { margin: .25rem 0; line-height: 1.5; }
    .bar { height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden; margin: 1.5rem auto; width: 220px; }
    .bar::after { content: ""; display: block; height: 100%; width: 40%; background: #1d4ed8;
                  animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Fashion Trend Forecast</h1>
    <p>Starting the app in your browser&hellip;</p>
    <div class="bar"></div>
    <p style="font-size:.9rem;color:#6b7280">The first visit can take up to a minute while Python loads in your browser.
      Later visits are faster.</p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
    const options = {
  "requirements": [
    "plotly"
  ],
  "entrypoint": "app.py",
  "files": {
    "app.py": {
      "url": "./app.py?v=656b69bc71"
    },
    "outputs/forecast/calls.csv": {
      "url": "./outputs/forecast/calls.csv?v=ad846b60e4"
    },
    "outputs/forecast/forecast.csv": {
      "url": "./outputs/forecast/forecast.csv?v=e6b2b95fbd"
    },
    "outputs/forecast/history.csv": {
      "url": "./outputs/forecast/history.csv?v=3694f17b5d"
    },
    "outputs/forecast/items.csv": {
      "url": "./outputs/forecast/items.csv?v=14e8615111"
    },
    "outputs/forecast/meta.json": {
      "url": "./outputs/forecast/meta.json?v=175ad6ac45"
    },
    "outputs/forecast/past_forecasts.npz": {
      "url": "./outputs/forecast/past_forecasts.npz?v=afee638e94"
    },
    "outputs/forecast/test_summary.csv": {
      "url": "./outputs/forecast/test_summary.csv?v=0c4a416cd5"
    },
    "outputs/forecast/track_record.csv": {
      "url": "./outputs/forecast/track_record.csv?v=1cd91666d3"
    },
    "outputs/forecast/validation.json": {
      "url": "./outputs/forecast/validation.json?v=437dea0e7f"
    },
    "outputs/forecast/wgsn_check.csv": {
      "url": "./outputs/forecast/wgsn_check.csv?v=31f672c51e"
    },
    "data/insights/post_counts.csv": {
      "url": "./data/insights/post_counts.csv?v=661c443206"
    },
    "data/insights/runway.csv": {
      "url": "./data/insights/runway.csv?v=c98cb20d0e"
    },
    "data/insights/runway_direction.csv": {
      "url": "./data/insights/runway_direction.csv?v=65457f05e3"
    },
    "data/google_trends/not_forecast.csv": {
      "url": "./data/google_trends/not_forecast.csv?v=bb442a82e3"
    }
  },
  "streamlitConfig": {
    "client.toolbarMode": "viewer",
    "theme.base": "light",
    "theme.primaryColor": "#1d4ed8",
    "theme.font": "sans serif"
  }
};
    mount(options, document.getElementById("root"));
    const hide = () => { const l = document.getElementById("loading"); if (l) l.remove(); };
    new MutationObserver((_, obs) => {
      if (document.querySelector('[data-testid="stApp"] h1')) { hide(); obs.disconnect(); }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
